name: Signed transition differential

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.ruby }} on ${{ matrix.os }}${{ matrix.name_suffix }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        ruby: ['2.3', '2.4', '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0', jruby-9.1, jruby-9.2, jruby-9.3, jruby-9.4, jruby-10.0, jruby-10.1]
        architecture: [default]
        name_suffix: ['']
        experimental: [false]
        include:
          - os: windows-2022
            ruby: '2.3'
            architecture: x86
            name_suffix: ' (x86)'
            experimental: false
          - os: ubuntu-24.04
            ruby: head
            architecture: default
            name_suffix: ' (experimental)'
            experimental: true
          - os: ubuntu-24.04
            ruby: jruby-head
            architecture: default
            name_suffix: ' (experimental)'
            experimental: true
          - os: windows-2022
            ruby: head
            architecture: default
            name_suffix: ' (experimental)'
            experimental: true
          - os: windows-2022
            ruby: jruby-head
            architecture: default
            name_suffix: ' (experimental)'
            experimental: true
          - os: ubuntu-24.04
            ruby: truffleruby-40
            architecture: default
            name_suffix: ' (experimental)'
            experimental: true
      fail-fast: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - if: (startsWith(matrix.ruby, 'jruby-9.1') || startsWith(matrix.ruby, 'jruby-9.2')) && startsWith(matrix.os, 'ubuntu-')
        uses: philr/setup-ruby@legacy-v1
        with:
          ruby-version: ${{ matrix.ruby }}
          architecture: ${{ matrix.architecture }}
          bundler-cache: true
      - if: ${{ !((startsWith(matrix.ruby, 'jruby-9.1') || startsWith(matrix.ruby, 'jruby-9.2')) && startsWith(matrix.os, 'ubuntu-')) }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          architecture: ${{ matrix.architecture }}
          bundler-cache: true
      - run: ruby --version
      - run: gem --version
      - run: bundle --version
      - name: Compare the exact refreshed reader with master
        shell: bash
        run: |
          git diff --exit-code 57056ddd7f46f9c292e46687821636e812102c85 -- lib test Gemfile tzinfo.gemspec
          git show 1207d6098d7f4a9f294a40801154990850f09bf1:lib/tzinfo/data_sources/zoneinfo_reader.rb > baseline-reader.rb
          BASELINE_READER=baseline-reader.rb bundle exec ruby signed-check.rb > baseline.json
          bundle exec ruby signed-check.rb > head.json
          ruby -e "abort 'Differential mismatch' unless File.binread('baseline.json') == File.binread('head.json'); puts 'PASS: identical baseline/head results'"
        env:
          TZINFO_SOURCE: .
