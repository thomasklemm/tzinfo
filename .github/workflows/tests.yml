name: Signed transition differential on Windows x86

on: [push, pull_request]

jobs:
  test:
    name: MRI 2.3 on Windows, verified 32-bit
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install published 32-bit RubyInstaller and concurrent-ruby
        shell: pwsh
        run: |
          curl.exe --fail --location https://github.com/oneclick/rubyinstaller/releases/download/ruby-2.3.3/ruby-2.3.3-i386-mingw32.7z -o ruby.7z
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z x ruby.7z -ox86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $RubyBin = (Get-ChildItem x86 -Recurse -Filter ruby.exe | Select-Object -First 1).Directory.FullName
          $RubyBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          curl.exe --fail --location https://rubygems.org/downloads/concurrent-ruby-1.3.8.gem -o concurrent-ruby.gem
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$RubyBin/ruby.exe" "$RubyBin/gem" install --local --no-document concurrent-ruby.gem
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: ruby --version
      - run: ruby -e "abort 'Not 32-bit Ruby' unless [0].pack('J').bytesize == 4"
      - name: Compare the exact refreshed reader with master
        shell: bash
        run: |
          git diff --exit-code 57056ddd7f46f9c292e46687821636e812102c85 -- lib test Gemfile tzinfo.gemspec
          git show 1207d6098d7f4a9f294a40801154990850f09bf1:lib/tzinfo/data_sources/zoneinfo_reader.rb > baseline-reader.rb
          BASELINE_READER=baseline-reader.rb ruby signed-check.rb > baseline.json
          ruby signed-check.rb > head.json
          ruby -e "abort 'Differential mismatch' unless File.binread('baseline.json') == File.binread('head.json'); puts 'PASS: identical baseline/head results'"
        env:
          TZINFO_SOURCE: .
